server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://pi.home:3306/travel-trip
    username: root
    password: admin

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs

zy:
  documentation:
    group-id: default
    group-display-name: Travel Trip API
    description: Family road trip planning service API
    version: ${APP_VERSION:1.0.0-SNAPSHOT}
